    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>My Orders | screenings4u</title>
        <link rel="icon" type="image/png" href="images/fav.png">

      <link rel="stylesheet" href="assets/css/client.css">
      <link rel="stylesheet" href="assets/css/client-navigation.css">
      <link rel="stylesheet" href="assets/css/client-orders.css">
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body class="client-page">
    <div class="client-app">
      <nav id="clientNavigation" aria-label="Client navigation"></nav>
      <main class="client-main">
        <header class="client-header">
          <div>
            <p class="eyebrow">CLIENT PORTAL</p>
            <h1>My Orders</h1>
            <p>Review your orders, purchased services, and order status.</p>
          </div>
          <div id="clientIdentity" class="client-identity"></div>
        </header>
        <section class="client-panel">
          <div class="client-panel-heading">
            <div><p class="eyebrow">ORDER HISTORY</p><h2>All Orders</h2></div>
            <input id="orderSearch" class="client-search-input" type="search"
                   placeholder="Search order number..." autocomplete="off">
          </div>
          <div id="ordersTable" class="client-table-wrap">
            <div class="client-empty-state">Loading orders...</div>
          </div>
        </section>
        <div id="clientToast" class="client-toast" role="status" aria-live="polite"></div>
      </main>
    </div>
    <script src="assets/js/client-config.js"></script>
    <script src="assets/js/client-navigation.js"></script>
    <script src="assets/js/client-orders.js"></script>
    </body>
    </html>
