<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DOT MIS Reports | screenings4u Admin</title><link rel="stylesheet" href="assets/css/admin.css"><link rel="stylesheet" href="assets/css/admin-navigation.css"><link rel="stylesheet" href="assets/css/admin-dot.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-page dot-page"><div class="admin-app admin-app-shared-nav"><nav id="adminNavigation"></nav><main class="admin-main"><div class="dot-shell"><header class="dot-hero"><div class="dot-hero-copy"><div class="dot-eyebrow">DOT CONSORTIUM / MIS</div><h1>MIS Reports</h1><p>Maintain annual drug and alcohol testing statistics and track report readiness and submission status.</p></div><div class="dot-hero-actions"><a class="dot-btn dot-btn-light" href="admin-dot-consortium.html">← Consortium</a><button type="button" id="newMisButton" class="dot-btn dot-btn-primary">+ New Report</button></div></header><section class="dot-section"><div class="dot-card"><div class="dot-toolbar"><div><div class="dot-section-kicker">ANNUAL REPORTING</div><h2>MIS Data</h2><p><span id="count">—</span> report records</p></div><button type="button" id="refreshButton" class="dot-btn dot-btn-muted">↻ Refresh</button></div><div id="data" class="dot-table-wrap"><div class="dot-loading"><span class="dot-spinner"></span>Loading MIS reports...</div></div></div></section></div></main></div><div id="misModal" class="dot-modal"><div class="dot-modal-card"><div class="dot-modal-head"><div><div class="dot-section-kicker">MIS REPORT</div><h2>New Report</h2></div><button type="button" class="dot-modal-close" id="closeMisModal">×</button></div><form id="misForm"><div class="dot-fields"><div class="dot-field"><label>Consortium</label><select id="misConsortium" required></select></div><div class="dot-field"><label>Employer</label><select id="misEmployer"></select></div><div class="dot-field"><label>Report Year</label><input id="reportYear" type="number" required></div><div class="dot-field"><label>Driver Positions</label><input id="driverPositions" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Drug Tests</label><input id="drugTests" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Drug Positives</label><input id="drugPositives" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Drug Refusals</label><input id="drugRefusals" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Alcohol Tests</label><input id="alcoholTests" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Alcohol Violations</label><input id="alcoholViolations" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Alcohol Refusals</label><input id="alcoholRefusals" type="number" min="0" step="1" value="0"></div><div class="dot-field"><label>Status</label><select id="reportStatus"><option value="draft">Draft</option><option value="ready">Ready</option><option value="submitted">Submitted</option><option value="archived">Archived</option></select></div><div class="dot-field"><label>Requested by FMCSA</label><select id="requested"><option value="false">No</option><option value="true">Yes</option></select></div><div class="dot-field full"><label>Notes</label><textarea id="notes"></textarea></div></div><div class="dot-form-actions"><button type="button" id="cancelMis" class="dot-btn dot-btn-muted">Cancel</button><button type="button" class="dot-btn dot-btn-primary">Save Report</button></div></form></div></div><div id="dotToast" class="admin-toast"></div><script src="assets/js/admin-config.js"></script><script src="assets/js/admin-guard.js"></script><script src="assets/js/admin-navigation.js"></script><script src="assets/js/admin-dot-mis.js"></script></body></html>
