<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Training | screenings4u</title>

  <link rel="stylesheet" href="assets/css/client.css">
  <link rel="stylesheet" href="assets/css/client-navigation.css">
  <link rel="stylesheet" href="assets/css/client-training.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="client-page">

  <div id="clientApp" class="client-app">

    <nav id="clientNavigation" aria-label="Client navigation"></nav>

    <main class="client-main client-training-page">

      <header class="client-header training-page-header">
        <div>
          <p class="eyebrow">TRAINING</p>
          <h1>My Courses</h1>
          <p>Continue your assigned screenings4u training courses.</p>
        </div>

        <div class="training-header-actions">
          <a href="client-dashboard.html" class="client-secondary-button">
            ← Dashboard
          </a>
        </div>
      </header>

      <section id="lmsTrainingSummary" class="lms-summary-grid" aria-label="Training summary"></section>

      <section class="client-panel training-course-panel">

        <div class="client-panel-heading training-toolbar">
          <div>
            <p class="eyebrow">MY TRAINING</p>
            <h2>Enrolled Courses</h2>
          </div>

          <div class="training-search-wrap">
            <label for="lmsCourseSearch" class="sr-only">Search courses</label>
            <input
              id="lmsCourseSearch"
              class="training-search"
              type="search"
              placeholder="Search courses…"
              autocomplete="off"
            >
          </div>
        </div>

        <div id="lmsStudentError" class="lms-message lms-error" role="alert" hidden></div>

        <div id="lmsStudentLoading" class="lms-message" role="status">
          Loading your courses…
        </div>

        <div id="lmsStudentCourses" class="lms-course-grid" aria-live="polite"></div>

        <div id="lmsStudentEmpty" class="lms-empty-state" hidden>
          <div class="lms-empty-icon">✓</div>
          <h3>No training courses yet</h3>
          <p>Courses assigned to your account will appear here.</p>
          <a href="client-dashboard.html" class="client-primary-button">
            Return to Dashboard
          </a>
        </div>

      </section>

    </main>
  </div>

  <script src="assets/js/client-config.js"></script>
  <script src="assets/js/client-navigation.js"></script>
  <script src="assets/js/client-training.js"></script>
</body>
</html>
