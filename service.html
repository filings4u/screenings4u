<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting | screenings4u</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="images/fav.png" type="image/png">
<script src="assets/js/test-price-list.js"></script>
</head>
<body>
<p>Redirecting to your order…</p>
<script>
(async function(){
  try{
    if(typeof refreshTestingCatalog==="function") await refreshTestingCatalog();
    const id=new URLSearchParams(location.search).get("service");
    if(!id){ location.replace("services.html"); return; }
    const service=typeof getTestService==="function" ? getTestService(id) : null;
    if(!service){ location.replace("services.html"); return; }
    const url=typeof getTestOrderUrl==="function"
      ? getTestOrderUrl(id)
      : "checkout.html?service="+encodeURIComponent(id);
    location.replace(url||"services.html");
  }catch(e){
    location.replace("services.html");
  }
})();
</script>
</body>
</html>
