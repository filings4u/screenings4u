<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account | screenings4u</title>

  <link rel="stylesheet" href="assets/css/client.css">
  <link rel="stylesheet" href="assets/css/client-navigation.css">
  <link rel="stylesheet" href="assets/css/client-account.css?v=20260822-3">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="client-page client-account-page">

  <div class="client-app">

    <nav
      id="clientNavigation"
      aria-label="Client navigation"
    ></nav>

    <main class="client-main">

      <header class="client-header account-page-header">
        <div>
          <p class="eyebrow">ACCOUNT</p>

          <h1>My Account</h1>

          <p>
            Manage your customer information and account password.
          </p>
        </div>

        <div
          id="clientIdentity"
          class="client-identity"
        ></div>
      </header>

      <section class="client-panel account-panel">

        <div class="client-panel-heading">
          <div>
            <p class="eyebrow">PROFILE</p>
            <h2>Account Information</h2>
          </div>
        </div>

        <form
          id="accountForm"
          class="client-account-form"
        >

          <div class="account-form-grid">

            <div class="form-group">
              <label for="firstName">First Name</label>

              <input
                id="firstName"
                type="text"
                autocomplete="given-name"
              >
            </div>

            <div class="form-group">
              <label for="lastName">Last Name</label>

              <input
                id="lastName"
                type="text"
                autocomplete="family-name"
              >
            </div>

            <div class="form-group">
              <label for="email">Email</label>

              <input
                id="email"
                type="email"
                disabled
              >
            </div>

            <div class="form-group">
              <label for="phone">Phone</label>

              <input
                id="phone"
                type="tel"
                autocomplete="tel"
              >
            </div>

            <div class="form-group account-full">
              <label for="company">Company</label>

              <input
                id="company"
                type="text"
                autocomplete="organization"
              >
            </div>

            <div class="form-group account-full">
              <label for="address">Address</label>

              <input
                id="address"
                type="text"
                autocomplete="street-address"
              >
            </div>

          </div>

          <div class="account-form-footer">
            <button
              class="client-primary-button"
              type="submit"
            >
              Save Changes
            </button>

            <p
              id="accountMessage"
              class="form-message"
              role="status"
            ></p>
          </div>

        </form>

      </section>

      <section class="client-panel account-panel security-panel">

        <div class="client-panel-heading">
          <div>
            <p class="eyebrow">SECURITY</p>
            <h2>Change Password</h2>
          </div>
        </div>

        <form
          id="passwordForm"
          class="client-account-form password-form"
        >

          <div class="password-form-fields">

            <div class="form-group">
              <label for="newPassword">
                New Password
              </label>

              <input
                id="newPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </div>

            <div class="form-group">
              <label for="confirmPassword">
                Confirm New Password
              </label>

              <input
                id="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </div>

          </div>

          <div class="account-form-footer">
            <button
              class="client-primary-button"
              type="submit"
            >
              Update Password
            </button>

            <p
              id="passwordMessage"
              class="form-message"
              role="status"
            ></p>
          </div>

        </form>

      </section>

    </main>
  </div>

  <script src="assets/js/client-config.js"></script>
  <script src="assets/js/client-navigation.js"></script>
  <script src="assets/js/client-account.js"></script>

</body>
</html>
