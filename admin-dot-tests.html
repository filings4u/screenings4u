<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DOT Testing | screenings4u Admin</title><link rel="stylesheet" href="assets/css/admin.css"><link rel="stylesheet" href="assets/css/admin-navigation.css"><link rel="stylesheet" href="assets/css/admin-dot.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-page dot-page"><div class="admin-app admin-app-shared-nav"><nav id="adminNavigation"></nav><main class="admin-main"><div class="dot-shell"><header class="dot-hero"><div class="dot-hero-copy"><div class="dot-eyebrow">DOT CONSORTIUM / TESTING</div><h1>DOT Testing</h1><p>Schedule and track pre-employment, random, post-accident, reasonable-suspicion, return-to-duty and follow-up tests.</p></div><div class="dot-hero-actions"><a class="dot-btn dot-btn-light" href="admin-dot-consortium.html">← Consortium</a><button type="button" id="newTestButton" class="dot-btn dot-btn-primary">+ Schedule Test</button></div></header><section class="dot-section"><div class="dot-card"><div class="dot-toolbar"><div><div class="dot-section-kicker">TESTING QUEUE</div><h2>DOT Tests</h2><p><span id="count">—</span> test records</p></div><div class="dot-actions"><select id="statusFilter" class="dot-field" style="min-height:44px;padding:10px 12px;border:1px solid #ccd8e7;border-radius:9px"><option value="all">All Statuses</option><option value="scheduled">Scheduled</option><option value="notified">Notified</option><option value="collected">Collected</option><option value="pending_result">Pending Result</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="no_show">No Show</option></select><button type="button" id="refreshButton" class="dot-btn dot-btn-muted">↻ Refresh</button></div></div><div id="data" class="dot-table-wrap"><div class="dot-loading"><span class="dot-spinner"></span>Loading DOT tests...</div></div></div></section></div></main></div><div id="testModal" class="dot-modal"><div class="dot-modal-card"><div class="dot-modal-head"><div><div class="dot-section-kicker">DOT TEST RECORD</div><h2>Schedule Test</h2></div><button type="button" class="dot-modal-close" id="closeTestModal">×</button></div><form id="testForm"><div class="dot-fields"><div class="dot-field"><label>Employer</label><select id="testEmployer" required></select></div><div class="dot-field"><label>Driver</label><select id="testDriver"></select></div><div class="dot-field"><label>Reason</label><select id="testReason"><option value="pre_employment">Pre-Employment</option><option value="random">Random</option><option value="post_accident">Post-Accident</option><option value="reasonable_suspicion">Reasonable Suspicion</option><option value="return_to_duty">Return to Duty</option><option value="follow_up">Follow-Up</option><option value="other">Other</option></select></div><div class="dot-field"><label>Test Type</label><select id="testType"><option value="drug">Drug</option><option value="alcohol">Alcohol</option><option value="drug_and_alcohol">Drug + Alcohol</option></select></div><div class="dot-field"><label>Scheduled At</label><input id="scheduledAt" type="datetime-local"></div><div class="dot-field"><label>Collection Site</label><input id="collectionSiteName"></div><div class="dot-field full"><label>Collection Site Address</label><input id="collectionSiteAddress"></div><div class="dot-field"><label>Collector</label><input id="collectorName"></div><div class="dot-field"><label>CCF Number</label><input id="ccfNumber"></div><div class="dot-field full"><label>Notes</label><textarea id="notes"></textarea></div></div><div class="dot-form-actions"><button type="button" id="cancelTest" class="dot-btn dot-btn-muted">Cancel</button><button type="button" class="dot-btn dot-btn-primary">Save Test</button></div></form></div></div><div id="dotToast" class="admin-toast"></div><script src="assets/js/admin-config.js"></script><script src="assets/js/admin-guard.js"></script><script src="assets/js/admin-navigation.js"></script><script src="assets/js/admin-dot-tests.js"></script></body></html>
