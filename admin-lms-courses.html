<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Courses | screenings4u Admin</title>
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/admin-navigation.css">
  <link rel="stylesheet" href="assets/css/admin-lms-courses.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">
  <div class="admin-app">
    <nav id="adminNavigation" aria-label="Admin navigation"></nav>

    <main class="admin-main lms-courses-page">
      <header class="lms-courses-header">
        <div>
          <p class="eyebrow">LEARNING MANAGEMENT SYSTEM</p>
          <h1>Courses</h1>
          <p>Manage every course, its curriculum, lessons, and publishing status.</p>
        </div>
        <div class="lms-header-actions">
          <button id="refreshCoursesBtn" class="secondary-button" type="button">Refresh</button>
          <button id="createCourseBtn" class="primary-button" type="button">+ Create Course</button>
        </div>
      </header>

      <section class="lms-metrics" aria-label="Course metrics">
        <article class="lms-metric-card">
          <span>Total Courses</span>
          <strong id="metricTotal">0</strong>
        </article>
        <article class="lms-metric-card">
          <span>Published</span>
          <strong id="metricPublished">0</strong>
        </article>
        <article class="lms-metric-card">
          <span>Drafts</span>
          <strong id="metricDrafts">0</strong>
        </article>
        <article class="lms-metric-card">
          <span>Lessons</span>
          <strong id="metricLessons">0</strong>
        </article>
      </section>

      <section class="lms-toolbar">
        <div class="lms-search-wrap">
          <label for="courseSearch" class="sr-only">Search courses</label>
          <input id="courseSearch" type="search" placeholder="Search courses...">
        </div>
        <div class="lms-filter-wrap">
          <label for="statusFilter" class="sr-only">Filter status</label>
          <select id="statusFilter">
            <option value="all">All statuses</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="lms-view-toggle" role="group" aria-label="Course view">
          <button type="button" class="view-toggle active" data-view="cards">Cards</button>
          <button type="button" class="view-toggle" data-view="table">Table</button>
        </div>
      </section>

      <section id="courseCardsView" class="course-cards-view">
        <div id="courseCards" class="course-cards-grid"></div>
      </section>

      <section id="courseTableView" class="course-table-view" hidden>
        <div class="course-table-shell">
          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Status</th>
                <th>Sections</th>
                <th>Lessons</th>
                <th>Updated</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="courseTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="coursesEmpty" class="lms-empty" hidden>
        <div class="lms-empty-icon">LMS</div>
        <h2 id="emptyTitle">No courses found</h2>
        <p id="emptyMessage">Create your first course to start building your curriculum.</p>
        <button id="emptyCreateBtn" class="primary-button" type="button">+ Create Course</button>
      </section>
    </main>
  </div>

  <div id="coursesToast" class="admin-toast" role="status"></div>

  <script src="assets/js/admin-config.js"></script>
  <script src="assets/js/admin-navigation.js"></script>
  <script src="assets/js/admin-lms-courses.js"></script>
</body>
</html>
