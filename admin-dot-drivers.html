<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DOT Drivers | screenings4u Admin</title><link rel="stylesheet" href="assets/css/admin.css"><link rel="stylesheet" href="assets/css/admin-navigation.css"><link rel="stylesheet" href="assets/css/admin-dot.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-page dot-page"><div class="admin-app admin-app-shared-nav"><nav id="adminNavigation"></nav><main class="admin-main"><div class="dot-shell"><header class="dot-hero"><div class="dot-hero-copy"><div class="dot-eyebrow">DOT CONSORTIUM / DRIVERS</div><h1>Driver Registry</h1><p>Maintain CDL holder records, safety-sensitive status, active status, and random-pool eligibility.</p></div><div class="dot-hero-actions"><a class="dot-btn dot-btn-light" href="admin-dot-consortium.html">← Consortium</a><button type="button" id="newDriverButton" class="dot-btn dot-btn-primary">+ Add Driver</button></div></header><section class="dot-section"><div class="dot-card"><div class="dot-toolbar"><div><div class="dot-section-kicker">DRIVER DIRECTORY</div><h2>CDL Drivers</h2><p><span id="count">—</span> driver records</p></div><div class="dot-actions"><input id="search" class="dot-field" style="min-height:44px;padding:10px 12px;border:1px solid #ccd8e7;border-radius:9px" placeholder="Search driver, CDL, employee..."><button type="button" id="refreshButton" class="dot-btn dot-btn-muted">↻ Refresh</button></div></div><div id="data" class="dot-table-wrap"><div class="dot-loading"><span class="dot-spinner"></span>Loading drivers...</div></div></div></section></div></main></div><div id="driverModal" class="dot-modal"><div class="dot-modal-card"><div class="dot-modal-head"><div><div class="dot-section-kicker">DRIVER RECORD</div><h2>Add Driver</h2></div><button type="button" class="dot-modal-close" id="closeDriverModal">×</button></div><form id="driverForm"><div c
